services:
  db:
    image: mysql:8.0
    container_name: intellistock-db
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-devpassword}
      MYSQL_DATABASE: ${DB_NAME:-intellistock}
    ports:
      - "${DB_PORT:-3308}:3306"   # host 3306/3307 are taken on the dev machine (local MySQL80, another project)
    volumes:
      - db-data:/var/lib/mysql
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD:-devpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10

  model-service:
    build: ./model-service
    container_name: intellistock-model
    ports:
      - "8000:8000"
    volumes:
      - ./model-service/models:/app/models
    environment:
      MODEL_DIR: /app/models
      DEFAULT_MODEL_ID: v1.1-relative   # v1.0-base stays available via modelId (see BUILD-JOURNAL D16)

  api:
    build: ./api
    container_name: intellistock-api
    ports:
      - "${API_PORT:-5000}:8080"
    environment:
      ConnectionStrings__Inventory: "Server=db;Port=3306;Database=${DB_NAME:-intellistock};User=root;Password=${DB_ROOT_PASSWORD:-devpassword}"
      ModelService__BaseUrl: http://model-service:8000
      # development signing key; set JWT_KEY (32+ characters) for anything shared
      Jwt__Key: ${JWT_KEY:-development-only-signing-key-not-for-production-use}
      Cors__Origins__0: http://localhost:4201
    depends_on:
      db:
        condition: service_healthy
      model-service:
        condition: service_started

  # client:   Angular 17 - not built yet

volumes:
  db-data:
